# The world's brains (ROADMAP D5, K5): what a world body does out in the
# wild, as gambit rows you can read. Each row is
#
#     <who>: <condition> -> <action>
#
#   who        self, party (a party member), mob (the mob)
#   condition  always | hp < n | hp >= n | mp < n | mp >= n | tp < n | tp >= n
#              | has <status> | lacks <status> | top enmity | not top enmity
#   action     avoid aggro | rest with leader | home point with
#              leader | boost before weapon skills | formation <lead|flank left|flank
#              right|rear left|rear right|behind> | role <support mage|tank|damage> | cast
#              best <spell> (the best tier of that spell's family she knows) |
#              cast <spell> | cast random damage | ability <name> | best weapon
#              skill | random weapon skill
#
# Names are the game's own: spells and abilities as in the database
# (spaces for underscores: "cure ii", "sneak attack"), statuses as the
# status enum ("poison", "paralysis", "sleep", "sleep ii"). A row that
# does not read is logged and left out; the rest stand.
#
# These rows are a layer of their own, not a body's rows. Every character
# has her own rows -- a saved set, else her job's defaults (the fights she
# takes, rest with the player, her role) -- the same list wherever she is,
# and the only one the gambit editor shows. While a world body is out in the
# wild (not in a player's party, not held by his contract) she also runs
# this file's rows, AHEAD of her own: the `world` block every body runs,
# then her job's block, then her role's, top to bottom, then her own rows.
# The first row whose conditions hold acts, and a row she cannot use (a
# spell she doesn't know, an ability on recast) is passed over. Invited
# into a player's party, she runs her own rows alone: nothing here --
# avoid aggro, a weapon skill, a cure -- goes with her.
#
# Roles: a Warrior or Paladin is the tank when she is the highest of them
# in her party, and the tank leads the camp; the others and the fighters
# are melee; the mages are White, Black, Red Mage, Summoner, Scholar and
# Geomancer, the jobs whose own defaults make them a Support Mage. No block
# has a `role` row: her role is her own row, and one here would outrank it
# in the wild. The file is re-read within seconds of a change and every
# world body picks it up; these rows are compiled to the same numeric form
# the addon saves for your own cardians. `tools/world/check.py` compiles
# every row against the same tables, so a typo fails a test before a
# restart (./dev-servers.ps1 census runs it).

world:
  - "self: always -> avoid aggro"
  - "self: always -> rest with leader"

roles:
  tank:
    - "mob: not top enmity -> ability provoke"     # Jevyak's row
    - "mob: hp >= 60 -> best weapon skill"
  melee:
    - "mob: hp >= 60 -> best weapon skill"
  mage:
    - "party: hp < 60 -> cast best cure"          # Zapp's row
    - "party: has sleep -> cast cure"             # a Cure wakes her; "sleep" answers Sleep II and Lullaby too
    - "mob: hp >= 50 -> cast random damage"       # never one the mob already carries

jobs:
  MNK:
    - "self: always -> boost before weapon skills" # Boost, then the weapon skill on the next tick, nothing between
  WHM:
    - "party: has poison -> cast poisona"
    - "party: has paralysis -> cast paralyna"
