# Southern_San_dOria: the slot table (RESEARCH.md §11.5, ROADMAP D4) -- what
# happens where, never who. The town's first slice (2026-09-07): turnstile
# seats on the streets, nothing indoors yet (the shops, the guild and the
# tavern stand at their doors until the door work lands). Every `at` is a
# guess from the NPC positions in tools/world/town/Southern_San_dOria.yaml;
# the user fixes the taste spots by walking. Hours are the player's local
# clock; the Tanners' Guild keeps Vana'diel's (vhours), shut Iceday.
#
# A stand slot with a dwell is a turnstile: she walks in from `enter`, holds
# the seat dwell seconds facing `face`, walks out by `exit` and fades, and
# the seat refills with another face. `nearest` and `any` are exits too.
exits:
  - name: west_gate
    at: [-110.0, -0.2, -57.0]
  - name: east_gate
    at: [110.0, -0.2, -57.0]
  - name: north_gate
    at: [0.0, -2.2, 54.0]
  - name: mog_house
    at: [163.0, -2.2, 162.0]
slots:
  # -- The West Gate (F-10 / G-10) -------------------------------------
  # Signet and out: in from the square, a beat square to the overseer,
  # then out to Ronfaure
  - activity: stand
    band: [1, 75]
    count: 3
    at: [-102.0, 0.0, -50.0]
    spread: 2
    face: [-104.9, 0.0, -53.1]
    dwell: [10, 25]
    enter: north_gate
    exit: west_gate
    hours: [6, 22]
  # Loitering at the west gate: standing about inside the arch, a long while
  - activity: stand
    band: [1, 75]
    count: 4
    at: [-96.7, 1.0, -56.2]
    spread: 5
    dwell: [120, 600]
    enter: any
    exit: west_gate
    cliques: [1, 4]
  # The east gate, the same, fewer
  - activity: stand
    band: [1, 75]
    count: 2
    at: [95.9, 1.0, -50.4]
    spread: 3
    dwell: [120, 600]
    enter: any
    exit: east_gate
    cliques: [1, 2]
  # Coming home: in from Ronfaure, a stop in the square, then to the Mog House
  - activity: stand
    band: [1, 75]
    count: 4
    at: [0.0, 1.7, -22.0]
    spread: 7
    dwell: [30, 120]
    enter: west_gate
    exit: mog_house
    cliques: [1, 2]
