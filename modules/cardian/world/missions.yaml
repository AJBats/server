# The rank-6 fight (the Shadow Lord) is level 50 here: this server caps it at
# 75, era players fought it at 50 (ROADMAP: cap the fight to 50 on our side).
# Era story missions (ToAU era, 2007) with the level a player would
# realistically be when attempting each, so a simulation can place an AI
# character on a mission by her level.
#
# `level`      the level a typical era player attempted it at (a single int)
# `solo`       the page's solo level, where it gives a party level and a solo one
# `cap`        the fight's (or, in CoP, the chapter's) era level cap
# `rank_after` the nation rank granted on completion -- nation logs only, and
#              only where a mission script actually grants it
# `guess`      the level is interpolated, not read off a source page
# `placeholder` the enum id has no mission script of its own (a chapter marker,
#              a sub-mission handled inside its parent's script, or a log's
#              completion marker)
# `requires`   a hard gate to start the log's first mission, read from the scripts
# `sentinel`   the enum's no-mission value; not a mission, listed so the file
#              accounts for every id in the enum
#
# Authority, in order: the ids and keys are parsed from
# scripts/globals/missions.lua and must never disagree with it; `rank_after`
# and `cap` come from the mission and battlefield scripts under scripts/;
# `level` comes from the FFXI wiki (ffxiclopedia.fandom.com), read per mission
# page, falling back to the fight's cap and then to interpolation.
#
# Levels are non-decreasing within a log: where a page gave a lower level than
# an earlier mission, the running maximum is used (called out per log below).

logs:
